version: 1
send_anonymous_usage_stats: true
project_id: tap-bigmarker
plugins:
  extractors:
  - name: tap-bigmarker
    namespace: tap_bigmarker
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    settings:
    - name: api_key
      kind: password
    - name: api_url
    - name: page_size
      value: '10'
    - name: download_bmid
    - name: custom_email_id
    - name: meeting_space_id
    - name: integration_type
    - name: registered_conferences_email
    - name: channel_block_list_type
    - name: registration_block_list_type
    - name: custom_email_action_type
    - name: custom_email_date_start
    - name: custom_email_date_end
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
